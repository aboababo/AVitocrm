# A generic, single database configuration.

[alembic]
# Path to alembic migrations folder
script_location = alembic

# Path to the alembic migrations folder relative to the alembic.ini file
# script_location = alembic

# template used to generate migration file names; The default value is %%(year)d_%%(month).02d_%%(day).02d_%%(hour).02d%%(minute).02d%%(second).02d_%%(rev)s_%%(slug)s
# file_template = %%(year)d_%%(month).02d_%%(day).02d_%%(hour).02d%%(minute).02d%%(second).02d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if not None
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, callable must return a string representing the
# timezone.  Defaults to the local timezone.
# timezone =

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file; defaults to "true" in non-debug
# mode for int compatibility
# sourceless = false

# version path separator; as mentioned earlier, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. If this key is omitted entirely, it falls back to the legacy
# behavior of splitting on spaces and/or commas.
# Valid values for version_path_separator are:
#
# version_path_separator = :
# version_path_separator = ;
# version_path_separator = space
version_path_separator = os

# set to 'true' to source the version number from the given
# version_locations rather than from the script_location
# version_locations = %(here)s/versions

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = sqlite:///./osagaming_crm.db

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S