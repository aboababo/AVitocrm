services:
  backend:
    build: .
    # Бэкенд не доступен извне, только внутри Docker сети
    # ports:
    #   - "8000:8000"
    volumes:
      - ./osagaming_crm.db:/app/osagaming_crm.db  # Используем старую базу из корня
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./osagaming_crm.db
      - DATABASE_URL_ASYNC=sqlite+aiosqlite:///./osagaming_crm.db
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "8000:80"  # Фронтенд доступен на порту 8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge